<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aidan's Garage</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{--bg:#16152b;--glass:rgba(18,18,34,.72);--line:rgba(255,255,255,.14);--text:#f4f3f8;--muted:#b9b7cf;--accent:#9fd3ff;--accent-ink:#0f1a2b}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#cdd8e6;color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  canvas{display:block;outline:none}
  .serif{font-family:"Instrument Serif",serif;font-weight:400}
  em.hl{font-style:italic;color:var(--accent)}

  /* top bar (sits over a bright sky, so it gets a soft dark fade for contrast) */
  .top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:22px 28px 60px;pointer-events:none;z-index:5;
       background:linear-gradient(rgba(12,12,28,.55),rgba(12,12,28,0))}
  .top > *{pointer-events:auto}
  .brand h1{font-size:40px;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.35)}
  .brand .sub{font-size:12px;color:#e6e5f0;margin-top:6px;letter-spacing:.04em}
  .pill{all:unset;cursor:pointer;display:inline-block;font-size:11px;color:var(--text);border:1px solid var(--line);padding:8px 14px;border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);text-decoration:none}
  .pill:hover{background:rgba(30,30,55,.85)}
  .pill.on{background:var(--text);color:var(--bg)}
  .brand .pill{margin-top:12px;margin-right:6px}
  body.panel-open #tourBtn{display:none}

  /* parts list */
  .parts{position:fixed;left:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;z-index:5;background:var(--glass);backdrop-filter:blur(10px);
         border:1px solid var(--line);border-radius:16px;padding:12px 8px}
  .parts button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);padding:4px 10px 4px 4px;border-radius:999px;transition:.2s}
  .parts button i{font-style:normal;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:600}
  .parts button:hover,.parts button.on{color:var(--text);background:rgba(255,255,255,.07)}
  .parts button.on i{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .parts .ttl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 6px 6px}
  @media(max-width:820px){.parts{display:none}}

  /* hotspot dots */
  .hs{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:rgba(159,211,255,.96);color:var(--accent-ink);
      font-size:10px;font-weight:700;display:grid;place-items:center;cursor:pointer;z-index:3;transition:opacity .25s,background .2s;
      box-shadow:0 0 0 2px rgba(18,18,34,.55),0 2px 8px rgba(0,0,0,.3);animation:pulse 2.4s infinite}
  .hs:hover{background:#fff}
  .hs.hid{opacity:.15;pointer-events:none;animation:none}
  .hs.off{display:none}
  body.inside .hs{display:none}
  body.inside #panel{top:auto;bottom:84px;right:20px;width:min(340px,calc(100% - 40px));max-height:42vh;border:1px solid var(--line);border-radius:16px;
                     background:rgba(16,16,32,.62)}
  body.inside #panelBody{padding:18px 20px 12px}
  body.inside .p-title{font-size:30px;margin:4px 0 8px}
  body.inside .p-body{font-size:12.5px}
  body.inside .p-stats{margin-top:12px}
  body.inside .p-stat{padding:10px}
  body.inside .p-stat b{font-size:24px}
  body.inside .p-list{margin-top:12px}
  body.inside .p-list span{padding:5px 10px;font-size:11.5px}
  body.inside .tour{padding:8px 12px 10px;grid-template-columns:36px 1fr 36px}
  body.inside .tour > button{width:36px;height:36px;font-size:17px}
  body.inside.panel-open .bottom{right:0}
  @media(max-width:820px){body.inside #panel{left:12px;right:12px;width:auto;bottom:76px;max-height:36vh;border-radius:16px}}
  @keyframes pulse{0%{box-shadow:0 0 0 2px rgba(18,18,34,.55),0 0 0 0 rgba(159,211,255,.6)}70%{box-shadow:0 0 0 2px rgba(18,18,34,.55),0 0 0 10px rgba(159,211,255,0)}}

  /* hover tooltip */
  #tip{position:fixed;z-index:6;pointer-events:none;background:rgba(14,13,30,.92);border:1px solid var(--line);padding:8px 12px;border-radius:10px;font-size:12px;
       transform:translate(14px,14px);opacity:0;transition:opacity .15s;white-space:nowrap}
  #tip b{display:block;font-weight:600;font-size:13px}
  #tip span{color:var(--muted)}
  #tip.show{opacity:1}

  /* spec sheet panel */
  #panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:rgba(20,19,38,.95);backdrop-filter:blur(14px);border-left:1px solid var(--line);
         z-index:8;transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
  #panelBody{flex:1;overflow-y:auto;padding:30px 30px 24px}
  /* tour bar: big previous / next buttons + one mark per stop */
  .tour{border-top:1px solid var(--line);padding:12px 16px 14px;display:grid;grid-template-columns:44px 1fr 44px;gap:12px;align-items:center;background:rgba(14,14,30,.6)}
  .tour > button{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:20px;color:var(--text);transition:.2s}
  .tour > button:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .tour .where{font-size:11px;color:var(--muted);text-align:center;margin-bottom:8px;letter-spacing:.04em}
  .tour .where b{color:var(--text);font-weight:600}
  .steps{display:flex;gap:4px}
  .steps button{all:unset;cursor:pointer;flex:1;height:14px;display:grid;align-items:center}
  .steps button::before{content:"";height:4px;border-radius:4px;background:rgba(255,255,255,.18);transition:.2s}
  .steps button:hover::before{background:rgba(255,255,255,.45)}
  .steps button.done::before{background:rgba(159,211,255,.45)}
  .steps button.on::before{background:var(--accent);height:6px}
  #panel.open{transform:none}
  @media(max-width:820px){#panel{top:auto;height:62vh;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%)}}
  .close{all:unset;cursor:pointer;position:absolute;top:18px;right:20px;font-size:22px;color:var(--muted);width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
  .close:hover{background:rgba(255,255,255,.08);color:var(--text)}
  .p-part{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .p-title{font-family:"Instrument Serif",serif;font-size:44px;line-height:1.02;margin:6px 0 14px}
  .p-body{font-size:14px;color:#d6d4e4;line-height:1.6}
  .p-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
  .p-stat{border:1px solid var(--line);border-radius:12px;padding:14px}
  .p-stat b{display:block;font-family:"Instrument Serif",serif;font-weight:400;font-size:34px;line-height:1;color:var(--accent)}
  .p-stat span{font-size:11px;color:var(--muted)}
  .p-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
  .p-list span{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px}
  .p-list a.lnk{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;color:var(--text);
                text-decoration:none;background:rgba(255,255,255,.03);transition:.2s}
  .p-list a.lnk svg{opacity:.7}
  .p-list a.lnk:hover{border-color:var(--accent);color:var(--accent);background:rgba(159,211,255,.08)}
  .p-list a.lnk:hover svg{opacity:1}
  .p-list span em{font-style:normal;color:var(--accent);margin-left:6px;font-weight:600}
  .p-group{margin-top:22px}
  .p-group h4{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .p-group .p-list{margin-top:10px}
  .p-btn{display:inline-block;margin-top:24px;padding:11px 20px;border-radius:999px;background:var(--text);color:var(--bg);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
  .p-btn:hover{background:var(--accent)}
  /* finale recap */
  .recap{margin-top:18px;border-top:1px solid var(--line)}
  .recap button{all:unset;cursor:pointer;display:grid;grid-template-columns:22px 1fr 14px;gap:12px;align-items:center;width:100%;box-sizing:border-box;padding:10px 4px;border-bottom:1px solid var(--line);transition:.15s}
  .recap button:hover{background:rgba(255,255,255,.04)}
  .recap i{font-style:normal;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--muted)}
  .recap b{display:block;font-size:12.5px;font-weight:600}
  .recap span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
  .recap button::after{content:"›";color:var(--muted);font-size:16px}
  .recap button:hover i{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .p-outro{margin-top:26px;font-family:"Instrument Serif",serif;font-size:30px;line-height:1.1}

  /* bottom bar: paint, lights, scenery */
  .bottom{position:fixed;left:0;right:0;bottom:20px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:0 16px;z-index:4;pointer-events:none;transition:right .45s cubic-bezier(.2,.8,.2,1)}
  .bottom > *{pointer-events:auto}
  body.panel-open .bottom{right:400px}
  .paint{display:flex;gap:6px;align-items:center;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-size:11px;color:var(--muted)}
  .paint button{all:unset;cursor:pointer;width:17px;height:17px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
  .paint button.on{border-color:var(--text)}
  .paint b{font-weight:500;color:var(--text);min-width:150px;margin-left:4px}
  .seg{display:flex;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:3px}
  .seg button{all:unset;cursor:pointer;font-size:11px;color:var(--muted);padding:5px 11px;border-radius:999px}
  .seg button.on{background:var(--text);color:var(--bg)}
  @media(max-width:820px){.bottom{bottom:12px}body.panel-open .bottom{right:0}.paint b{display:none}}
  .credit{position:fixed;right:10px;bottom:3px;font-size:7.5px;color:#fff;opacity:.55;z-index:4;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .credit a{color:inherit}

  #loading{position:fixed;inset:0;display:grid;place-items:center;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);z-index:20;background:var(--bg);transition:opacity .6s}
</style>
</head>
<body>

<div id="loading">Opening the garage…</div>

<div class="top">
  <div class="brand">
    <h1 class="serif">Aidan's <em class="hl">Garage</em></h1>
    <div class="sub" id="sub"></div>
    <button class="pill" id="reset">↺ Reset view</button>
    <button class="pill" id="tourBtn">▶ Tour the car</button>
  </div>
  <a class="pill" href="portfolio.html">← Back to portfolio</a>
</div>

<nav class="parts" id="parts"><div class="ttl">Spec sheet</div></nav>
<div id="tip"></div>

<aside id="panel" aria-live="polite">
  <button class="close" id="close" aria-label="Close">×</button>
  <div id="panelBody"></div>
  <div class="tour">
    <button id="prev" aria-label="Previous stop">‹</button>
    <div><div class="where" id="where"></div><div class="steps" id="steps"></div></div>
    <button id="next" aria-label="Next stop">›</button>
  </div>
</aside>

<div class="bottom">
  <div class="paint" id="paint"><b id="paintName"></b></div>
  <button class="pill on" id="lightsBtn">💡 Lights on</button>
  <div class="seg" id="scenes"></div>
</div>
<div class="credit" id="credit"></div>

<script src="assets/cls63s.glb.js"></script>
<script src="assets/amg-v8.glb.js"></script>

/* ---- scenery: equirectangular HDR panorama projected onto the ground ---- */
const rgbe = new RGBELoader();
let skybox = null, sceneIdx = 0;
function sunFrom(tex) {                       // find the brightest spot in the panorama and put the sun there
  const { data, width, height } = tex.image, half = data instanceof Uint16Array;
  let best = -1, bu = 0.5, bv = 0.7;
  for (let y = 0; y < height / 2; y += 2) for (let x = 0; x < width; x += 2) {
    const i = (y * width + x) * 4;
    const r = half ? THREE.DataUtils.fromHalfFloat(data[i]) : data[i];
    const g = half ? THREE.DataUtils.fromHalfFloat(data[i + 1]) : data[i + 1];
    const b = half ? THREE.DataUtils.fromHalfFloat(data[i + 2]) : data[i + 2];
    const l = r * 0.2126 + g * 0.7152 + b * 0.0722;
    if (l > best) { best = l; bu = x / width; bv = 1 - y / height; }
  }
  const theta = (bu - 0.5) * Math.PI * 2, lat = Math.max(0.35, (bv - 0.5) * Math.PI);  // keep it high enough for a nice shadow
  return new THREE.Vector3(Math.cos(lat) * Math.cos(theta), Math.sin(lat), Math.cos(lat) * Math.sin(theta));
}
function capBrightness(tex, cap) {
  const d = tex.image.data, half = d instanceof Uint16Array;
  const get = i => half ? THREE.DataUtils.fromHalfFloat(d[i]) : d[i];
  const put = (i, x) => (d[i] = half ? THREE.DataUtils.toHalfFloat(x) : x);
  for (let i = 0; i < d.length; i += 4) {
    const r = get(i), g = get(i + 1), b = get(i + 2), m = Math.max(r, g, b);
    if (m > cap) { const k = cap / m; put(i, r * k); put(i + 1, g * k); put(i + 2, b * k); }
  }
  tex.needsUpdate = true;
}
function loadScene(i) {
  sceneIdx = i;

  rgbe.load(`https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/2k/${SCENES[i].hdr}_2k.hdr`, tex => {
    if (i !== sceneIdx) return tex.dispose();
    tex.mapping = THREE.EquirectangularReflectionMapping;
    const dir = sunFrom(tex);
    capBrightness(tex, 10);
    sun.position.copy(dir.multiplyScalar(20));

}

}
function useModel(root) {
  root.rotation.y = THREE.MathUtils.degToRad(MODEL.rotateY);
  const wrap = new THREE.Group(); wrap.add(root);
  let bb = new THREE.Box3().setFromObject(wrap);
  wrap.scale.setScalar(4.72 / bb.getSize(new THREE.Vector3()).x);
  bb = new THREE.Box3().setFromObject(wrap);
  const c = bb.getCenter(new THREE.Vector3());
  wrap.position.set(-c.x, -bb.min.y, -c.z);
  scene.add(wrap); wrap.updateMatrixWorld(true);

  const made = {}, meshes = [];
  root.traverse(o => { if (o.isMesh) meshes.push(o); });
  const modelPicks = [];
  meshes.forEach(o => {
    const n = (o.material?.name || "").replace("#", ""), f = FINISH[n];
    if (n === "PAINT") o.material = made.PAINT ||= Object.assign(new THREE.MeshPhysicalMaterial({ color: PAINTS[paintIdx][1], ...FINISHES[PAINTS[paintIdx][2]] }), { name: "PAINT" });
    else if (f && !o.material.map) o.material = made[n] ||= Object.assign(new THREE.MeshPhysicalMaterial(f), { name: n });
    if (n === "GLASS") glassMat = made.GLASS;
    if (o.material) o.material.side = THREE.DoubleSide;   // body panels are one-sided; draw both faces so doors don't vanish from inside
    splitByPart(o).forEach(m => {
      const k = m.userData.part, mat = m.material.name;
      if (mat === "LIGHTS") m.material = k === "lights" ? headLED : k === "trunk" ? tailLED : sideLens;   // LED headlights + red tail lights
      else if (mat === "GLASS" && k === "lights") m.material = headLens;
      else if (mat === "GLASS" && k === "trunk") m.material = tailLens;
      m.castShadow = true; m.receiveShadow = true;
      (partMeshes[k] ||= []).push(m); modelPicks.push(m);
    });
  });
  // swap the built-in car out: its parts stay as invisible helpers for hiding dots behind the car
  for (const k in partMeshes) partMeshes[k] = partMeshes[k].filter(m => !proxies.includes(m) || /plate/i.test(k));
  proxies.forEach(m => { if (!/plate/i.test(m.userData.part || "")) m.visible = false; });
  const L = MODEL.layout;
  wheels.forEach((w, i) => w.position.set(i < 2 ? L.wheels.front : L.wheels.rear, L.wheels.y, (i % 2 ? -1 : 1) * L.wheels.z));
  Object.entries(L.anchors).forEach(([k, val]) => anchorV[k]?.set(...val));
  plates[0].position.set(L.frontPlate[0], L.frontPlate[1], 0);
  plates[1].position.set(L.rearPlate[0], L.rearPlate[1], 0);
  pickables = [...modelPicks, ...plates];
  paintMeshes.length = 0; if (made.PAINT) paintMeshes.push({ material: made.PAINT });
  applyPaint();
  $("credit").innerHTML = MODEL.credit;
  // turn the front wheels (tyre, rim, brake) around their own vertical axis
  [0, 1].forEach(i => {
    const pivot = new THREE.Group(); pivot.position.set(L.wheels.front, L.wheels.y, (i ? -1 : 1) * L.wheels.z);
    scene.add(pivot); pivot.updateMatrixWorld(true);
    partMeshes["wheel" + i].forEach(m => pivot.attach(m));
    pivot.rotation.y = L.steer || 0;
    wheels[i].rotation.y = L.steer || 0;
  });
  // hinge the real hood panel at its back edge so it can lift
  const hm = modelPicks.filter(m => m.name.startsWith(L.hood.mesh));
  if (hm.length) {
    hood.pivot = new THREE.Group(); hood.pivot.position.set(L.hood.hinge[0], L.hood.hinge[1], 0);
    scene.add(hood.pivot); hood.pivot.updateMatrixWorld(true);
    hm.forEach(m => hood.pivot.attach(m));
    buildEngine();
  }
  const tm = modelPicks.filter(m => L.trunk.meshes.some(n => m.name.startsWith(n)));
  if (tm.length) {
    trunk.pivot = new THREE.Group(); trunk.pivot.position.set(L.trunk.hinge[0], L.trunk.hinge[1], 0);
    scene.add(trunk.pivot); trunk.pivot.updateMatrixWorld(true);
    tm.forEach(m => trunk.pivot.attach(m));
    buildCargo();
  }
  modelLoaded = true;
  loadEngine();
  if (selected) open(selected); else fromHash();   // a stop picked while the car was loading now gets the real interior / hood
}
const modelUrl = new URLSearchParams(location.search).get("model") || window.CAR_MODEL_DATA || MODEL.url;
if (modelUrl) {
  const fallback = () => { console.info("No model at " + MODEL.url + ", showing the built-in car."); fromHash(); };
  try {
    const draco = new DRACOLoader().setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/");
    new GLTFLoader().setDRACOLoader(draco).load(modelUrl.startsWith("data:") ? modelUrl : new URL(modelUrl, location.href).href, g => useModel(g.scene), undefined, fallback);
  } catch { fallback(); }
}

// deep links: index.html#hood opens that part
function fromHash() { const k = location.hash.slice(1); if (PARTS[k]) open(k); }
addEventListener("hashchange", fromHash);

let loadingGone = false;
function hideLoading() { if (loadingGone) return; loadingGone = true; $("loading").style.opacity = 0; setTimeout(() => $("loading").remove(), 700); }
setTimeout(hideLoading, 6000);     // never block the page on slow scenery
loadScene(0);
</script>
</body>
